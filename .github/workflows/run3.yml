name: run3

on:
  workflow_dispatch:
    inputs:
      accounts_file:
        description: "邮箱账号文件路径（默认 pool_accounts.json，即 db/register.json 拉下来的副本）"
        required: false
        default: "pool_accounts.json"
      workers:
        description: "并发数"
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: 检出注册代码（私有 jjj）
        uses: actions/checkout@v4
        with:
          repository: DanielLawrence9553/jjj
          token: ${{ secrets.PAT }}
          ref: master

      - name: 检出数据仓库（db）
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.PAT }}@github.com/DanielLawrence9553/db.git db
          cd db
          git config user.name "Claude Auto"
          git config user.email "claude@localhost"
          git branch -m master main 2>/dev/null || true

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 拉取账号池（db/register.json，只体检已消耗的账号）
        run: |
          if [ ! -f db/register.json ]; then
            echo "::error::db/register.json 不存在"
            exit 1
          fi
          cp db/register.json ./pool_accounts.json
          echo "已拉取 register.json，体检脚本将自动过滤 status=used/failed 的账号"

      - name: 邮箱体检（判定死活/是否注册，仅已消耗账号）
        run: |
          ACCOUNTS_FILE="${{ github.event.inputs.accounts_file || 'pool_accounts.json' }}"
          if [ ! -f "$ACCOUNTS_FILE" ]; then
            echo "::error::账号文件不存在: $ACCOUNTS_FILE"
            exit 1
          fi
          python check_openai_account_status.py "$ACCOUNTS_FILE" --workers "${{ github.event.inputs.workers || '8' }}"

      - name: 上传体检结果到 db 仓库
        run: |
          for f in 邮箱体检_活.txt 邮箱体检_死.txt 邮箱体检_未注册.txt 邮箱体检_取信失败.txt; do
            if [ -f "$f" ]; then
              # 统一命名，便于 run4 读取
              case "$f" in
                邮箱体检_活.txt) cp "$f" db/final_alive.txt ;;
                邮箱体检_死.txt) cp "$f" db/final_dead.txt ;;
                邮箱体检_未注册.txt) cp "$f" db/final_not_registered.txt ;;
                邮箱体检_取信失败.txt) cp "$f" db/final_fetch_failed.txt ;;
              esac
            fi
          done
          cd db
          git add -A
          git commit -m "auto: run3 邮箱体检 $(date -u +%Y%m%d-%H%M%S)" || true
          git push origin main
