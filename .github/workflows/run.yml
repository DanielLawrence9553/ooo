name: run

on:
  workflow_dispatch:
    inputs:
      count:
        description: "注册数量"
        required: true
        default: "390"
      workers:
        description: "并发数"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: 检出注册代码（私有 jjj）
        uses: actions/checkout@v4
        with:
          repository: DanielLawrence9553/jjj
          token: ${{ secrets.PAT }}
          ref: master

      - name: 安装 warp（Cloudflare WARP 代理）
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp || true
          sudo systemctl start warp-svc 2>/dev/null || warp-cli register 2>/dev/null || true

      - name: 配置并启用 warp 代理
        run: |
          warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos set-mode proxy
          warp-cli --accept-tos set-proxy-port 40000
          warp-cli --accept-tos connect 2>/dev/null || true
          sleep 3
          warp-cli --accept-tos status || true
          echo "WARP_READY=1" >> $GITHUB_ENV

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install camoufox
          camoufox fetch

      - name: 检查 warp 出口
        run: |
          curl -sS --proxy socks5://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp)=" || echo "warp proxy not ready"

      - name: 注册
        run: |
          python main.py -n "${{ github.event.inputs.count }}" --workers "${{ github.event.inputs.workers }}" --continue-on-fail --verbose
        env:
          # 让程序走 warp socks5 出口注册
          PROXY_POOL: "socks5://127.0.0.1:40000"
          REMOTE_OUTLOOK_REPO: "DanielLawrence9553/db"
          REMOTE_OUTLOOK_FILE: "register.json"
